# The project gallery on the website, rendered by docs/source/conf.py.
#
# One entry per project: the title and the one-line summary on its card, and the page it links to (in
# docs/source/projects/). The optional image is a path from the repository root, usually a plot the project's
# tests write into data/ in CI, so that the card shows what the current code produces. See
# docs/contrib/06_new_project.md for adding a project.

- section: Methods and analysis
  projects:
    - title: Parallel SDC
      page: parallelSDC
      image: data/parallelSDC_preconditioner_heat.png
      summary: Strategies to parallelize SDC across the collocation nodes, within each iteration.
    - title: Improving parallelism across the method
      page: parallelSDC_reloaded
      summary: The numerical experiments of the paper on parallel SDC by Čaklović, Lunet, Götschel and Ruprecht.
    - title: Fast-wave slow-wave SDC
      page: fwsw
      image: data/boussinesq.png
      summary: Semi-implicit SDC for fast waves, compared with RK-IMEX and DIRK schemes, and its stability.
    - title: Rational deferred corrections
      page: RDC
      summary: The RDC method of Güttel and Klein, with equidistant nodes and a blended barycentric interpolant.
    - title: Asymptotic convergence of PFASST
      page: asymp_conv
      image: data/conv_test_niter_NS3.png
      summary: How PFASST converges for linear problems, in the stiff and in the non-stiff limit.
    - title: Matrix-based PFASST
      page: matrixPFASST
      summary: PFASST for linear problems, written as a two-grid method and as a propagation matrix.
    - title: SDC for second-order problems
      page: second_order
      summary: The figures of the paper by Akramov, Götschel, Minion, Ruprecht and Speck.
    - title: Hamiltonian systems with Verlet-SDC
      page: Hamiltonian
      image: data/fput_positions.png
      summary: The harmonic oscillator, Hénon-Heiles, Fermi-Pasta-Ulam-Tsingou and the solar system.
    - title: What is the fastest SDC variant?
      page: SDC_showdown
      image: data/timings_SDC_variants_GrayScott.png
      summary: Fully, semi- and multi-implicit SDC with PETSc, for the Fisher and the Gray-Scott equations.
    - title: Differential-algebraic equations
      page: DAE
      summary: Sweepers, problems and scripts for solving differential-algebraic equations with SDC.

- section: Applications
  projects:
    - title: Allen-Cahn problems from Bayreuth
      page: AllenCahn_Bayreuth
      image: data/AC-test-noforce_radii.png
      summary: Allen-Cahn-type problems from materials science, for correctness, parallelization and benchmarks.
    - title: Energy systems with discrete events
      page: PinTSimE
      image: data/buck_converter_model_solution.png
      summary: Microgrids and other systems with switches, and an estimator that restarts SDC at the events.
    - title: Exponential SDC for the heart
      page: monodomain
      image: data_monodomain/stability_domain_IMEXEXP.png
      summary: Exponential SDC for the monodomain equation of cardiac electrophysiology.
    - title: Rayleigh-Bénard convection
      page: RayleighBenard
      summary: 3D convection at Rayleigh numbers up to 1e7, with SDC and Runge-Kutta, on CPUs and GPUs.
    - title: StrömungsRaum
      page: StroemungsRaum
      summary: Space-time parallel methods for fluid dynamics on heterogeneous exascale hardware.

- section: High-performance computing
  projects:
    - title: Performance analysis
      page: performance
      image: pySDC/projects/Performance/vampir_traces_pySDC_AC_4x2_intel_v2.png
      summary: Space-time parallel runs traced with Score-P and Vampir, to understand their parallel performance.
    - title: Resilience
      page: Resilience
      image: data/piline_hotrod_adaptive_1procs.png
      summary: Adaptivity and Hot Rod against bit flips, e.g. from radiation, and fault statistics.
    - title: Lossy compression
      page: compression
      image: data_libpressio/compression_order_time_advection_d=1.00e-06_n=1_MPI=False.png
      summary: Compressing the data SDC keeps at the collocation nodes, and what it costs in accuracy.
    - title: pySDC on GPUs
      page: GPU
      summary: Running pySDC on GPUs with CuPy, up to large problems, and the plots of Thomas Baumann's thesis.
