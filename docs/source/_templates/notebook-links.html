{%- if page_source_suffix == '.py' %}
{%- set notebook = pagename.split('/')[-1] ~ '.ipynb' %}
<div class="notebook-links">
  {%- if run_in_browser %}
  <button class="btn btn-sm run-in-browser" data-wheels="{{ browser_wheels|join(' ') }}" data-wheels-url="{{ pathto('_static/wheels/', 1) }}"><i class="fa-solid fa-play"></i> Run in browser</button>
  {%- endif %}
  <a class="btn btn-sm" href="{{ notebook }}" download><i class="fa-solid fa-download"></i> Notebook</a>
  <a class="btn btn-sm" href="https://colab.research.google.com/github/Parallel-in-Time/pySDC/blob/gh-pages/{{ pagename }}.ipynb" target="_blank" rel="noopener"><i class="fa-brands fa-google"></i> Open in Colab</a>
  {%- if run_in_browser %}<p class="rib-status" aria-live="polite"></p>{%- endif %}
</div>
{%- endif %}
