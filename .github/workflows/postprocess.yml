---

name: Create Website for pySDC

# A `workflow_run` always executes from the default branch, whatever branch the
# triggering run was on. Unfiltered, a feature branch's CI therefore produced a
# `master` run here that checked out master's source but combined the branch's
# coverage - dying on "No source for code" for any file the branch added - and
# uploaded that coverage to Codecov as master's head commit. `branches` matches
# the *triggering* run's head branch, so this now fires only for real master CI.
on:
  workflow_run:
    workflows: ["CI pipeline for pySDC"]
    types: ["completed"]
    branches: [master]
  
jobs:
  build_website:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.repository_owner == 'Parallel-in-Time'
      && github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: "etc/environment-postprocess.yml"
      - name: Downloading artifacts
        uses: actions/download-artifact@v8
        with:
          path: .
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.ACTION_READ_TOKEN }}
      - name: Prepare artifacts
        run: |
          python -m coverage combine coverage_*.dat
          python -m coverage xml
          python -m coverage html
      - name: Generate Coverage badge
        run: |
          genbadge coverage -i coverage.xml -o htmlcov/coverage-badge.svg
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        
#      - name: Generate benchmark report
