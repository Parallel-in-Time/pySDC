---

name: CI pipeline for pySDC

# A bare `push:` trigger fires alongside `pull_request` for the same commit,
# creating two runs of the ~42-job matrix. The `concurrency` group below
# cancels the loser, but only after all its jobs have been dispatched - you
# still see ~84 job entries. Restricting `push` to the branches that have no
# PR of their own stops the duplicate from ever being created. Feature
# branches get CI from `pull_request`; open a (draft) PR to run them.
on:
  push:
    branches:
      - master
      - 'v*'
  pull_request:
  schedule:
    - cron: '1 5 * * 1'

# Successive pushes to an open PR supersede each other; cancel the stale run
# rather than letting both finish. `head_ref` is only set on pull_request
# events (the PR's source branch); `ref_name` is the plain branch name on
# push events (unlike `ref`, which carries a `refs/heads/` prefix that would
# never match `head_ref`).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Keep this: it is what proved the exit-143 deaths are silent. With stdout
  # unbuffered there is still not one byte between "collecting ..." and the
  # SIGTERM, so nothing inside the process is reporting an error - see the
  # environment files for what the actual fix was.
  PYTHONUNBUFFERED: 1
  # OpenMPI refuses to oversubscribe by default, and PRRTE counts a "slot"
  # as a physical core - so on a 4-vCPU runner (2 cores + hyperthreading)
  # even `mpirun -np 3` fails with "not enough slots available". Several
  # tests ask for 3 or 4 ranks and Monodomain's asks for 24. MPICH
  # oversubscribed silently, which is why this only appeared after the swap.
  PRTE_MCA_rmaps_default_mapping_policy: ':oversubscribe'
  # ...and the OpenMPI 4 spelling of the same thing, which PRRTE superseded. The conda envs resolve
  # OpenMPI 5 and need the variable above; the Firedrake container ships OpenMPI 4 and needs this
  # one, which is why `mpiexec -n 3` there failed with "not enough slots available" while the same
  # command worked everywhere else. Each version ignores the other's variable.
  OMPI_MCA_rmaps_base_oversubscribe: 'true'

jobs:

  lint:
    runs-on: ubuntu-latest
    env:
      YML: 'etc/environment-lint.yml'
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ env.YML }}
          create-args: >-
              python=3.13
      - name: Code reformatting with black
        run: |
          black pySDC  --check --diff --color
      - name: Linting with ruff
        run: |
          ruff check pySDC
      - name: Validating the AI declaration with aidecl
        run: |
          aidecl --strict validate --output-format github-actions aidecl.yaml

  user_cpu_tests_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        env: ['base', 'fenics', 'mpi4py', 'petsc', 'pytorch']
        python: ['3.10', '3.11', '3.12', '3.13']
        numpy: ['', '=1']
        # pySDC supports both NumPy majors, so every backend is run against both. NumPy 1 gets one
        # python rather than four: 1.26 is the last 1.x release, it does not support 3.13 at all,
        # and 3.12 is the newest python all five backends still have NumPy 1 builds for.
        exclude:
          - {numpy: '=1', python: '3.10'}
          - {numpy: '=1', python: '3.11'}
          - {numpy: '=1', python: '3.13'}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: "etc/environment-${{ matrix.env }}.yml"
          create-args: >-
              python=${{ matrix.python }}
              numpy${{ matrix.numpy }}
      - name: Install additional packages as needed
        run: |
          micromamba install -y --file etc/environment-tests.yml --freeze-installed
      - name: Install pySDC as a package in the current environment
        run: |
          pip install --no-deps -e .
      - name: Run pytest for CPU stuff
        run: |
          echo "print('Loading sitecustomize.py...')
          import coverage
          coverage.process_startup() " > sitecustomize.py
          bash etc/run_mpi_tests.sh pySDC/tests "${{ matrix.env }}"
      - name: Make coverage report
        run: |
          coverage combine
          mv .coverage coverage_${{ matrix.env }}.dat
      - name: Uploading artifacts
        uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: test-artifacts-cpu-${{ matrix.env }}
          path: |
            data
            coverage_${{ matrix.env }}.dat

  project_cpu_tests_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        env:
          - AllenCahn_Bayreuth
          - AsympConv
          - DAE
          - FastWaveSlowWave
          - GPU
          - Hamiltonian
          - matrixPFASST
          - parallelSDC
          - parallelSDC_reloaded
          - PinTSimE
          - RDC
          - Resilience
          - RayleighBenard
          - SDC_showdown
          - Second_orderSDC
          - soft_failure
          - TOMS
          - StroemungsRaum
        numpy: ['', '=1']
        # Both NumPy majors here too. No python axis to exclude against: every project environment
        # allows the whole 3.10-3.13 range, so `numpy=1` simply resolves the newest python that has
        # NumPy 1 builds for that project's backends.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: "pySDC/projects/${{ matrix.env }}/environment.yml"
          create-args: >-
              numpy${{ matrix.numpy }}
      - name: Install additional packages as needed
        run: |
          micromamba install -y --file etc/environment-tests.yml --freeze-installed
      - name: Run pytest for CPU stuff
        run: |
          echo "print('Loading sitecustomize.py...')
          import coverage
          coverage.process_startup() " > sitecustomize.py
          # `not cupy`: these runners have no GPU. The GPU project's cupy-marked tests are run
          # against the NumPy stub in the step below instead; no other project has such a test.
          bash etc/run_mpi_tests.sh pySDC/projects/${{ matrix.env }}/tests "not cupy"
      - name: Make coverage report
        run: |
          coverage combine
          mv .coverage coverage_${{ matrix.env }}.dat
      - name: Uploading artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-project-${{ matrix.env }}
          path: |
            data
            coverage_${{ matrix.env }}.dat

  gpu_hardware_tests:
    # The `cupy`-marked tests, on an actual GPU rented per job from Modal; see
    # etc/modal_gpu_tests.py. This is the only job that runs them, so it is the only source of
    # coverage for `NCCL_communicator.py`, `cupy_mesh.py` and `log_GPU_timings.py`.
    #
    # Skipped for a pull request from a fork, which gets no secrets and so cannot reach Modal.
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the Modal client
        run: |
          pip install modal
      # Secrets are withheld from pull requests opened from a fork, so labelling one of those
      # would otherwise fail several minutes in with an unhelpful traceback from `modal run`.
      - name: Check that the Modal credentials are present
        run: |
          if [ -z "${{ secrets.MODAL_TOKEN_ID }}" ]; then
            echo "::error::No Modal credentials. Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as" \
                 "repository secrets, or run 'modal run etc/modal_gpu_tests.py' locally."
            exit 1
          fi
      # This step only rents the GPU: the container runs pytest under coverage and its output is
      # streamed back here, so the log below is an ordinary pytest log.
      - name: Run the cupy-marked tests on a T4
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal run etc/modal_gpu_tests.py
      - name: Uploading artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-gpu-hardware
          path: |
            coverage_GPU_hardware.dat

  user_libpressio_tests:
    runs-on: ubuntu-latest
    container:
      image: brownbaerchen/libpressio:amd64_2
      volumes:
        - ${{ github.workspace }}:/pySDC
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pySDC and pytest
        run: |
          source /pySDC/pySDC/projects/compression/Docker/install_pySDC.sh
          # the compression tests are collected through mpi-pytest's `parallel` marker
          pip install "mpi-pytest>=2026.0"
      - name: Run pytest
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack load libpressio
           
          bash etc/run_mpi_tests.sh pySDC/projects/compression/tests libpressio
      - name: Make coverage report
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack load libpressio

          mv data data_libpressio
          coverage combine
          mv .coverage coverage_libpressio.dat
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-libpressio
          path: |
            data_libpressio
            coverage_libpressio.dat

  user_firedrake_tests:
    runs-on: ubuntu-latest
    container:
      image: firedrakeproject/firedrake-vanilla-default@sha256:455fabbe164276329a4cc91af54a05f56bf383dd3164195d0fa1182e981f6839
      options: --user root
      volumes:
        - ${{ github.workspace }}:/repositories
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Fix HOME
        # For unknown reasons GitHub actions overwrite HOME to /github/home
        # which will break everything unless fixed
        # (https://github.com/actions/runner/issues/863)
        run: echo "HOME=/home/firedrake" >> "$GITHUB_ENV"
      - name: Checkout pySDC
        uses: actions/checkout@v7
        with: 
          path: ./pySDC
      - name: Checkout gusto
        uses: actions/checkout@v7
        with:
          repository: firedrakeproject/gusto
          path: ./gusto_repo
          # Last known passing Gusto commit in CI run 24328039993 / job 71027429748
          ref: f11fba9ee858aa84281baf41baa09704431ac0ff
      - name: Create virtual environment
        # pass '--system-site-packages' so Firedrake can be found
        run: python3 -m venv --system-site-packages venv-pySDC

      - name: Install pySDC
        run: |
          . venv-pySDC/bin/activate
          pip install -e /repositories/pySDC
          # The Firedrake image ships mpi-pytest for its own suite, but don't depend on that:
          # the MPI tests here are collected through its `parallel` marker.
          pip install "mpi-pytest>=2026.0"
          # test installation
          python -c "import pySDC; print(f'pySDC module: {pySDC}')"
      - name: Install gusto
        run: |
          . venv-pySDC/bin/activate
          pip install -e /repositories/gusto_repo
          # test installation
          python -c "import gusto; print(f'gusto module: {gusto}')"
      - name: run pytest
        run: |
          . venv-pySDC/bin/activate
          firedrake-clean
          # `cd /repositories/pySDC`, not `./pySDC`: the container mounts the workspace at
          # /repositories, so those are the same directory reached by two different paths. pySDC is
          # installed editable from /repositories/pySDC, so that is the prefix its modules report,
          # and `source = ['pySDC']` only matches when the working directory agrees -- sitting in
          # ./pySDC is why this job has always measured nothing. `..` is the workspace either way,
          # so the moves in the next step are unaffected.
          cd /repositories/pySDC
          PYTEST="python -m coverage run -m pytest --continue-on-collection-errors -v --durations=0" \
            bash etc/run_mpi_tests.sh /repositories/pySDC/pySDC/tests firedrake
        timeout-minutes: 45
      - name: Make coverage report
        run: |

          cd /repositories/pySDC
          mv data ../data_firedrake
          coverage combine
          mv .coverage ../coverage_firedrake.dat
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-firedrake
          path: |
            data_firedrake
            coverage_firedrake.dat
         
  user_monodomain_tests_linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: "pySDC/projects/Monodomain/etc/environment-monodomain.yml"
          create-args: >-
              python=3.12
      - name: Compile C++ ionic models
        env:
          IONIC_MODELS_PATH: "pySDC/projects/Monodomain/problem_classes/ionicmodels/cpp"
        run: >
          c++ -O3 -Wall -shared -std=c++11 -fPIC -fvisibility=hidden
          $(python3 -m pybind11 --includes)
          ${IONIC_MODELS_PATH}/bindings_definitions.cpp
          -o ${IONIC_MODELS_PATH}/ionicmodels$(python3-config --extension-suffix)
      - name: Run pytest for CPU stuff
        run: |
          echo "print('Loading sitecustomize.py...')
          import coverage
          coverage.process_startup() " > sitecustomize.py
          bash etc/run_mpi_tests.sh pySDC/projects/Monodomain/tests monodomain
      - name: Make coverage report
        run: |
          mv data data_monodomain
          coverage combine
          mv .coverage coverage_monodomain.dat
      - name: Uploading artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-monodomain
          path: |
            data_monodomain
            coverage_monodomain.dat

  docs:
    runs-on: ubuntu-latest
    # The website itself is built and deployed by the postprocess workflow,
    # from master only. This job runs the same build on every PR so that a
    # change which breaks the docs fails here, on the PR that caused it,
    # rather than silently on master at deploy time.
    #
    # It has to wait for the test jobs: several project READMEs embed plots
    # that the tests themselves write into `data/` (which is gitignored), so
    # the "image file not readable" check is meaningless on a bare checkout -
    # every one of those images would be missing.
    needs: [user_cpu_tests_linux, project_cpu_tests_linux, user_libpressio_tests, user_firedrake_tests, user_monodomain_tests_linux]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: "etc/environment-postprocess.yml"
      - name: Download the plots the tests produced
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: test-artifacts-*
          merge-multiple: true
      - name: Build the docs
        # `pipefail` matters here: without it `tee` supplies the exit code and
        # a failing sphinx-build would pass silently.
        run: |
          set -o pipefail
          chmod u+x ./docs/update_apidocs.sh
          ./docs/update_apidocs.sh
          sphinx-build -b html docs/source docs/build/html 2>&1 | tee sphinx_build.log
          # pySDC/tests/README.rst links the coverage badge, which genbadge
          # writes in the postprocess workflow just before it builds the site.
          # It is legitimately absent here, so it is not a broken link.
          images_not_found=$(grep "WARNING: image file not readable:" < sphinx_build.log | grep -v "coverage-badge.svg" | wc -l)
          if [ $images_not_found != "0" ] ; then
            echo "Some linked images were not found:"
            grep "WARNING: image file not readable:" < sphinx_build.log | grep -v "coverage-badge.svg"
            exit 1
          fi

  coverage_comment_on_pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !cancelled()
    needs: [user_cpu_tests_linux, project_cpu_tests_linux, user_libpressio_tests, user_firedrake_tests, user_monodomain_tests_linux, gpu_hardware_tests]
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: "etc/environment-postprocess.yml"
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: test-artifacts-*
          merge-multiple: true
      - name: Combine coverage reports
        continue-on-error: true
        run: |
          python -m coverage combine coverage_*.dat
          python -m coverage xml
          python -m coverage report
      - name: Post coverage comment on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        # Non-blocking: this only posts an informational PR comment, not a
        # correctness signal, and has been observed to fail on a transient
        # GitHub API 504 unrelated to this workflow (see PR #659). Don't
        # fail the whole PR's CI status over a comment.
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
