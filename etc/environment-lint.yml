---

name: pySDC
channels:
  - conda-forge
dependencies:
  # Pinned so that the lint CI and .pre-commit-config.yaml cannot drift apart: pre-commit needs a
  # rev, and an unpinned CI would silently move past it on the next release. Bump both together.
  - black=26.5.1
  - ruff=0.16.7
  - pip
  - pip:
      # aidecl is not on PyPI and upstream has no tags, so pin the commit
      - git+https://github.com/ai-declaration/cli.git@8c3eb30170b459e2e19a87f821f299de55dadfda
