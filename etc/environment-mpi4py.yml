---

name: pySDC
channels:
  - conda-forge
dependencies:
  - numpy>=1.15.4
  - scipy>=0.17.1
  - matplotlib>=3.0
  - dill>=0.2.6
  - openmpi
  - mpi4py-fft>=2.0.2
  - mpi4py>=3.0.0
  - pip
  - pip:
    - qmat>=0.1.8
    # 0.4 does not tear down the module collector after the last isolated test in a module, so
    # the next test in a different module dies at setup with "previous item was not torn down
    # properly". Reproduced against unmodified test_helpers: 0.3 passes, 0.4 errors. Unpin once
    # the plugin has a release with that fixed.
    - pytest-isolate-mpi==0.3
