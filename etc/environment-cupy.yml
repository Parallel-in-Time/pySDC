---

# A working GPU environment for pySDC: the CPU dependencies plus CuPy, which brings the CUDA
# toolkit with it. This is the one to create if you want to *run* pySDC on a GPU -- see
# pySDC/projects/GPU/README.rst.
#
# Not to be confused with pySDC/projects/GPU/environment.yml, which is for testing only: the GitHub
# runners have no GPU, so that one deliberately has no CuPy and the GPU code paths are exercised
# against a NumPy stub instead.
name: pySDC
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - numpy>=1.15.4
  - scipy>=0.17.1
  - matplotlib>=3.0
  - dill>=0.2.6
  # >=14 for `rtol`: CuPy renamed the iterative solvers' `tol` argument in 14, following the
  # same rename in SciPy, and `HeatEquation_ND_FD_CuPy` passes the new spelling.
  - cupy>=14
  # conda-forge's `cupy` does not depend on NCCL, but `pySDC/helpers/NCCL_communicator.py`
  # imports `cupy.cuda.nccl`, which is an empty shim unless libnccl is there. Without this,
  # building an `NCCLComm` fails with a bare `module 'cupy.cuda.nccl' has no attribute
  # 'get_unique_id'`, which says nothing about the missing library.
  - nccl
  # the GPU project's configs go through `spectral_helper`, and its runs are MPI-decomposed
  - openmpi
  # NOT ENOUGH ON ITS OWN for the GPU spectral code, which asks mpi4py-fft for a `cupy` /
  # `cupyx-scipy` FFT backend, for `DistArrayCuPy` and for the NCCL `comm_backend`. None of the
  # three is in any release: upstream declined the approach in mpi4py/mpi4py-fft#14, since
  # `cupy.ndarray` cannot be subclassed the way `DistArray` needs. They live on the
  # `cupy_implementation` branch of https://github.com/brownbaerchen/mpi4py-fft, which has to be
  # installed over this one -- see etc/modal_gpu_tests.py for the exact pinned command. This
  # entry stays because everything else here needs a working mpi4py-fft to build against.
  - mpi4py-fft>=2.0.2
  - mpi4py>=3.0.0
  - tqdm
  - pandas
  - pip
  - pip:
    - qmat>=0.1.8
