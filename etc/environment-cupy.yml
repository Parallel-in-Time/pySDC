---

# A working GPU environment for pySDC: the CPU dependencies plus CuPy, which brings the CUDA
# toolkit with it. This is the one to create if you want to *run* pySDC on a GPU -- see
# pySDC/projects/GPU/README.rst.
#
# Not to be confused with pySDC/projects/GPU/environment.yml, which is for testing only: the GitHub
# runners have no GPU, so that one deliberately has no CuPy and the GPU code paths are exercised
# against a NumPy stub instead.
name: pySDC
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - numpy>=1.15.4
  - scipy>=0.17.1
  - matplotlib>=3.0
  - dill>=0.2.6
  - cupy>=14  # 14 renamed the iterative solvers' `tol` argument to `rtol`
  - nccl  # `cupy.cuda.nccl` is an empty shim without it, and conda-forge's cupy does not pull it
  # the GPU project's configs go through `spectral_helper`, and its runs are MPI-decomposed
  - openmpi
  # not enough on its own for the GPU spectral code, which needs the fork installed over it;
  # see docs/contrib/02_continuous_integration.md
  - mpi4py-fft>=2.0.2
  - mpi4py>=3.0.0
  - tqdm
  - pandas
  - pip
  - pip:
    - qmat>=0.1.8
